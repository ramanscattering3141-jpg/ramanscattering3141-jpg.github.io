<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECG Physiology Lab</title>
    <meta name="description" content="Physiology-first ECG and cardiac electrophysiology education: a conduction simulator that generates 12-lead ECGs from mechanisms, with a rhythm library, interactive labs, a 3-D heart, an ACLS reference, cases and challenges." />
    <meta name="theme-color" content="#0b5cad" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ECG Physiology Lab" />
    <meta property="og:title" content="ECG Physiology Lab — don’t memorise the ECG, predict it" />
    <meta property="og:description" content="Every tracing is generated by a conduction simulator. Change the physiology, watch the 12-lead ECG change, then explain why." />
    <meta property="og:url" content="https://ramanscattering3141-jpg.github.io/ecg/" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ECG Physiology Lab" />
    <meta name="twitter:description" content="Physiology-first ECG education: change the physiology, watch the ECG change, then explain why." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b5cad'/%3E%3Cpath d='M3 18h6l2-6 3 12 3-17 3 11h9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved colour theme before first paint so the page never flashes the wrong theme.
      try {
        var t = JSON.parse(localStorage.getItem('ecg.theme') || '"auto"');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Shown until the app stylesheet and script load. */
      html { background: #f5f6f8; color: #16202b; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      html[data-theme='dark'] { background: #0f141a; color: #e6ebf1; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0f141a; color: #e6ebf1; } }
      #app:empty::before { content: 'Loading the ECG Physiology Lab…'; display: block; padding: 40px 24px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding: 24px">The ECG Physiology Lab is an interactive simulator and needs JavaScript. Please enable it and reload the page.</p></noscript>
    <script type="module" src="/src/ecg/main.ts"></script>
  </body>
</html>
